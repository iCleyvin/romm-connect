name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Release
    runs-on: [self-hosted, android]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/.nvm/versions/node/v22.22.2/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "$HOME/android-sdk/build-tools/35.0.0" >> $GITHUB_PATH

      - name: Install dependencies
        run: npm install

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean

      - name: Configure release signing
        run: |
          python3 - << 'PYEOF'
          import re

          props = """
          def keystoreProps = new Properties()
          keystoreProps.load(new FileInputStream(rootProject.file("keystore.properties")))
          """

          signing_block = """
                  release {
                      storeFile file(keystoreProps["storeFile"])
                      storePassword keystoreProps["storePassword"]
                      keyAlias keystoreProps["keyAlias"]
                      keyPassword keystoreProps["keyPassword"]
                  }
          """

          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r") as f:
              content = f.read()

          content = content.replace("android {", props + "\nandroid {", 1)

          content = re.sub(
              r'(signingConfigs \{)',
              r'\1' + signing_block,
              content,
              count=1
          )

          content = re.sub(
              r'(buildTypes \{[^}]*?release \{[^}]*?)(signingConfig signingConfigs\.debug)',
              r'\1signingConfig signingConfigs.release',
              content,
              count=1,
              flags=re.DOTALL
          )

          with open(gradle_path, "w") as f:
              f.write(content)

          print("build.gradle patched for release signing")
          PYEOF

          printf "%s\n" \
            "storeFile=$HOME/keystores/romm-connect.keystore" \
            "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            "keyAlias=romm-connect" \
            "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" \
            > android/keystore.properties

          echo "keystore.properties created"

      - name: Build AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Save builds to server
        run: |
          VERSION=$(node -p "require('./package.json').version")
          OUTPUT_DIR="$HOME/builds/romm-connect"
          mkdir -p "$OUTPUT_DIR"
          cp android/app/build/outputs/bundle/release/app-release.aab \
            "$OUTPUT_DIR/romm-connect-v${VERSION}-build${{ github.run_number }}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk \
            "$OUTPUT_DIR/romm-connect-v${VERSION}-build${{ github.run_number }}.apk"
          echo "Builds saved to $OUTPUT_DIR/"
          ls -lh "$OUTPUT_DIR/"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: romm-connect-aab-v${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: romm-connect-apk-v${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
