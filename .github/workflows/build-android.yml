name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Release
    runs-on: [self-hosted, android]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/.nvm/versions/node/v22.22.2/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "$HOME/android-sdk/build-tools/35.0.0" >> $GITHUB_PATH

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Expo Doctor
        # Uses an allowlist wrapper (scripts/expo-doctor-allowlist.js) that passes
        # only when the SOLE failure is the known duplicate @expo/fingerprint
        # (pulled by the hot-updater devDependency; build-time only, not bundled).
        # ANY other doctor failure fails the build instead of being hidden.
        run: npm run doctor:ci

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean

      - name: Configure release signing
        run: |
          python3 - << 'PYEOF'
          import re

          props = """
          def keystoreProps = new Properties()
          keystoreProps.load(new FileInputStream(rootProject.file("keystore.properties")))
          """

          signing_block = """
                  release {
                      storeFile file(keystoreProps["storeFile"])
                      storePassword keystoreProps["storePassword"]
                      keyAlias keystoreProps["keyAlias"]
                      keyPassword keystoreProps["keyPassword"]
                  }
          """

          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r") as f:
              content = f.read()

          content = content.replace("android {", props + "\nandroid {", 1)

          content = re.sub(
              r'(signingConfigs \{)',
              r'\1' + signing_block,
              content,
              count=1
          )

          # Point buildTypes.release at signingConfigs.release.
          # NOTE: the previous regex `buildTypes \{[^}]*?release \{[^}]*?...` was
          # broken: `[^}]` cannot cross the `}` of the debug{} block that precedes
          # release{} inside buildTypes, so the substitution silently matched 0
          # times and release builds stayed on the DEBUG signing config (shipping
          # debug-signed "release" artifacts). We anchor on the line that is unique
          # to the release block instead (it is followed by the shrinkResources def)
          # and then assert exactly one replacement happened.
          content, n = re.subn(
              r'signingConfig signingConfigs\.debug(\s*\n\s*def enableShrinkResources)',
              r'signingConfig signingConfigs.release\1',
              content,
              count=1
          )
          if n != 1:
              raise SystemExit(
                  "ERROR: expected exactly 1 release signingConfig replacement, got "
                  + str(n) + ". build.gradle template changed; fix the signing patch."
              )

          with open(gradle_path, "w") as f:
              f.write(content)

          # Validate the written file: release must use the release key, and the
          # release block must not retain the debug signingConfig.
          with open(gradle_path) as f:
              written = f.read()
          release_idx = written.find("buildTypes")
          release_block = written[release_idx:]
          if "signingConfig signingConfigs.release" not in written:
              raise SystemExit("ERROR: signingConfigs.release not present after patch.")
          import re as _re
          # In the buildTypes.release block, the signingConfig must be .release.
          m = _re.search(r'release \{[^}]*?signingConfig signingConfigs\.(\w+)',
                         release_block, _re.DOTALL)
          if not m or m.group(1) != "release":
              raise SystemExit(
                  "ERROR: buildTypes.release still not using signingConfigs.release "
                  "(found: " + (m.group(1) if m else "none") + ")."
              )

          print("build.gradle patched for release signing (verified)")
          PYEOF

          printf "%s\n" \
            "storeFile=$HOME/keystores/romm-connect.keystore" \
            "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            "keyAlias=romm-connect" \
            "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" \
            > android/keystore.properties

          echo "keystore.properties created"

      - name: Build AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify release signing
        # Defense-in-depth. A fragile regex previously left release builds on the
        # debug signingConfig, so debug-signed APKs could ship as "release". This
        # step hard-fails if the packaged APK is signed with the Android debug key,
        # and prints the signer DN to the logs for auditability.
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)"
          CERTS="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")"
          echo "$CERTS" | grep -i "certificate DN" || true
          if echo "$CERTS" | grep -qi "CN=Android Debug"; then
            echo "::error::Release APK is DEBUG-signed. Failing build."
            exit 1
          fi
          echo "Release signing verified (not debug-signed)."

      - name: Save builds to server
        run: |
          VERSION=$(node -p "require('./package.json').version")
          OUTPUT_DIR="$HOME/builds/romm-connect"
          mkdir -p "$OUTPUT_DIR"
          cp android/app/build/outputs/bundle/release/app-release.aab \
            "$OUTPUT_DIR/romm-connect-v${VERSION}-build${{ github.run_number }}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk \
            "$OUTPUT_DIR/romm-connect-v${VERSION}-build${{ github.run_number }}.apk"
          echo "Builds saved to $OUTPUT_DIR/"
          ls -lh "$OUTPUT_DIR/"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: romm-connect-aab-v${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: romm-connect-apk-v${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
